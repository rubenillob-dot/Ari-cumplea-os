<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="vr-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <filter id="vr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Laurel Wreath Wings -->
  <g fill="#eab308" opacity="0.9" stroke="#78350f" stroke-width="1.5">
    <!-- Left leaves -->
    <path d="M22 62 C14 52 14 36 24 24 C20 34 22 48 30 56 Z"/>
    <path d="M16 46 C10 38 12 28 20 20 C18 28 20 38 26 44 Z"/>
    <path d="M26 72 C18 64 16 52 24 42 C22 52 26 62 34 68 Z"/>
    <!-- Right leaves -->
    <path d="M78 62 C86 52 86 36 76 24 C80 34 78 48 70 56 Z"/>
    <path d="M84 46 C90 38 88 28 80 20 C82 28 80 38 74 44 Z"/>
    <path d="M74 72 C82 64 84 52 76 42 C78 52 74 62 66 68 Z"/>
  </g>
  <!-- Central Victory Star -->
  <polygon points="50,15 58,35 80,36 62,50 69,72 50,58 31,72 38,50 20,36 42,35" 
           fill="url(#vr-gold)" stroke="#78350f" stroke-width="3" filter="url(#vr-glow)" />
  <circle cx="50" cy="45" r="9" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="50" y="50" font-family="sans-serif" font-weight="900" font-size="14" fill="#854d0e" text-anchor="middle">#1</text>
</svg>
