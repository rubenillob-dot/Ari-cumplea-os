<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="24" height="24" shape-rendering="crispEdges">
  <!-- Minecraft Hardcore Heart (Pixel Art) -->
  <!-- Dark Outline -->
  <path d="M2,1 h3 v1 h-3 z M13,1 h3 v1 h-3 z
           M1,2 h1 v3 h-1 z M5,2 h2 v1 h-2 z M11,2 h2 v1 h-2 z M16,2 h1 v3 h-1 z
           M0,4 h1 v4 h-1 z M17,4 h1 v4 h-1 z
           M7,3 h4 v1 h-4 z
           M1,8 h1 v2 h-1 z M16,8 h1 v2 h-1 z
           M2,10 h1 v2 h-1 z M15,10 h1 v2 h-1 z
           M3,12 h2 v1 h-2 z M13,12 h2 v1 h-2 z
           M5,13 h2 v1 h-2 z M11,13 h2 v1 h-2 z
           M7,14 h4 v1 h-4 z M8,15 h2 v1 h-2 z" fill="#180000" />
  
  <!-- Red Body -->
  <path d="M2,2 h3 v2 h-3 z M13,2 h3 v2 h-3 z
           M1,4 h16 v4 h-16 z
           M2,8 h14 v2 h-14 z
           M3,10 h12 v2 h-12 z
           M5,12 h8 v1 h-8 z
           M7,13 h4 v1 h-4 z" fill="#c01515" />
           
  <!-- Dark Shadows in heart -->
  <path d="M12,4 h4 v4 h-1 v2 h-2 v1 h-2 v1 h-2 v1 h-1 v-1 h2 v-1 h2 v-2 h1 v-4 z" fill="#750b0b"/>
  
  <!-- Hardcore Angry Eyebrows/Eyes (Hardcore variant) -->
  <rect x="4" y="4" width="2" height="1" fill="#fff"/>
  <rect x="12" y="4" width="2" height="1" fill="#fff"/>
  <rect x="3" y="3" width="1" height="1" fill="#180000"/>
  <rect x="6" y="3" width="1" height="1" fill="#180000"/>
  <rect x="11" y="3" width="1" height="1" fill="#180000"/>
  <rect x="14" y="3" width="1" height="1" fill="#180000"/>
  
  <!-- Specular White Glint -->
  <rect x="2" y="2" width="2" height="2" fill="#ffffff" opacity="0.8"/>
</svg>
