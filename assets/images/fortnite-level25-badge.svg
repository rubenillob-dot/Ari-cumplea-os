<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="badge-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="purple-crest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#badge-shadow)">
    <!-- Starburst Ray Background -->
    <circle cx="50" cy="50" r="44" fill="url(#badge-glow)" />

    <!-- Golden Wings (Left and Right) -->
    <!-- Left Wing -->
    <path d="M 50 48 C 30 35, 12 30, 4 45 C 10 52, 22 56, 36 55 C 26 62, 14 62, 8 70 C 20 72, 34 68, 50 56 Z" fill="url(#gold-shield)" stroke="#713f12" stroke-width="1.2"/>
    <!-- Right Wing -->
    <path d="M 50 48 C 70 35, 88 30, 96 45 C 90 52, 78 56, 64 55 C 74 62, 86 62, 92 70 C 80 72, 66 68, 50 56 Z" fill="url(#gold-shield)" stroke="#713f12" stroke-width="1.2"/>

    <!-- Central Fortnite Shield / Gem Plaque -->
    <polygon points="50,14 80,32 72,74 50,92 28,74 20,32" fill="url(#purple-crest)" stroke="url(#gold-shield)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Inner Golden Border -->
    <polygon points="50,22 73,36 67,69 50,83 33,69 27,36" fill="#1e1138" stroke="#facc15" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Top Crown Accent -->
    <polygon points="42,28 46,24 50,27 54,24 58,28 50,30" fill="#facc15" stroke="#854d0e" stroke-width="0.8"/>

    <!-- "LVL / NIVEL" Label -->
    <text x="50" y="44" font-family="'Luckiest Guy', sans-serif" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">NIVEL</text>

    <!-- Number "25" in bold metallic gold with 3D offset -->
    <text x="50" y="68" font-family="'Luckiest Guy', sans-serif" font-size="28" font-weight="900" fill="#0f051d" text-anchor="middle">25</text>
    <text x="50" y="66" font-family="'Luckiest Guy', sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle">25</text>

    <!-- Bottom Stars -->
    <polygon points="50,73 52,78 57,78 53,81 55,86 50,83 45,86 47,81 43,78 48,78" fill="#facc15"/>
  </g>
</svg>
