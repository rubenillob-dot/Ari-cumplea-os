<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <defs>
    <!-- Enchantment Glow Filter -->
    <filter id="enchant-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#c084fc" flood-opacity="0.9"/>
      <feDropShadow dx="1" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#enchant-glow)">
    <!-- Sparkles near tip -->
    <rect x="2" y="0" width="2" height="2" fill="#fdf4ff"/>
    <rect x="0" y="2" width="2" height="2" fill="#fdf4ff"/>
    
    <!-- Pickaxe Head Outlines -->
    <rect x="2" y="2" width="3" height="3" fill="#2e1065"/>
    <rect x="5" y="1" width="5" height="2" fill="#2e1065"/>
    <rect x="10" y="2" width="4" height="2" fill="#2e1065"/>
    <rect x="14" y="3" width="4" height="2" fill="#2e1065"/>
    <rect x="18" y="5" width="3" height="3" fill="#2e1065"/>
    
    <rect x="1" y="5" width="2" height="5" fill="#2e1065"/>
    <rect x="2" y="10" width="2" height="4" fill="#2e1065"/>
    <rect x="3" y="14" width="2" height="4" fill="#2e1065"/>
    <rect x="5" y="18" width="3" height="3" fill="#2e1065"/>

    <!-- Handle Shaft Outlines -->
    <rect x="10" y="12" width="3" height="3" fill="#1b120c"/>
    <rect x="12" y="14" width="3" height="3" fill="#1b120c"/>
    <rect x="14" y="16" width="3" height="3" fill="#1b120c"/>
    <rect x="16" y="18" width="3" height="3" fill="#1b120c"/>
    <rect x="18" y="20" width="3" height="3" fill="#1b120c"/>
    <rect x="20" y="22" width="3" height="3" fill="#1b120c"/>
    <rect x="22" y="24" width="3" height="3" fill="#1b120c"/>
    <rect x="24" y="26" width="3" height="3" fill="#1b120c"/>
    <rect x="26" y="28" width="3" height="3" fill="#1b120c"/>

    <!-- Handle Wood Base -->
    <rect x="11" y="13" width="2" height="2" fill="#6b21a8"/>
    <rect x="13" y="15" width="2" height="2" fill="#9333ea"/>
    <rect x="15" y="17" width="2" height="2" fill="#c084fc"/>
    <rect x="17" y="19" width="2" height="2" fill="#9333ea"/>
    <rect x="19" y="21" width="2" height="2" fill="#c084fc"/>
    <rect x="21" y="23" width="2" height="2" fill="#9333ea"/>
    <rect x="23" y="25" width="2" height="2" fill="#c084fc"/>
    <rect x="25" y="27" width="2" height="2" fill="#9333ea"/>
    <rect x="27" y="29" width="2" height="2" fill="#6b21a8"/>

    <!-- Enchanted Diamond Blades (Cyan + Magenta/Purple shimmer) -->
    <!-- Left Wing -->
    <rect x="3" y="6" width="2" height="4" fill="#a5f3fc"/>
    <rect x="3" y="10" width="2" height="4" fill="#67e8f9"/>
    <rect x="4" y="14" width="2" height="4" fill="#e879f9"/>
    <rect x="6" y="17" width="2" height="2" fill="#c026d3"/>
    
    <!-- Top Wing -->
    <rect x="6" y="3" width="4" height="2" fill="#a5f3fc"/>
    <rect x="10" y="3" width="4" height="2" fill="#67e8f9"/>
    <rect x="14" y="4" width="4" height="2" fill="#e879f9"/>
    <rect x="17" y="6" width="2" height="2" fill="#c026d3"/>

    <!-- Center Head & Highlight Tip (Hotspot at 3,3) -->
    <rect x="3" y="3" width="3" height="3" fill="#ffffff"/>
    <rect x="5" y="4" width="2" height="2" fill="#f0abfc"/>
    <rect x="4" y="5" width="2" height="2" fill="#f0abfc"/>
    <rect x="7" y="5" width="3" height="3" fill="#38bdf8"/>
    <rect x="5" y="7" width="3" height="3" fill="#38bdf8"/>
    <rect x="8" y="8" width="3" height="3" fill="#c084fc"/>

    <!-- Iron Neck Reinforcement -->
    <rect x="10" y="10" width="2" height="2" fill="#e9d5ff"/>
  </g>
</svg>
