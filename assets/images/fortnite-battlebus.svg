<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="bus-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#bus-glow)">
    <!-- Hot Air Balloon Canopy -->
    <ellipse cx="32" cy="16" rx="18" ry="12" fill="#0284c7" stroke="#082f49" stroke-width="1.5"/>
    <path d="M 14 16 Q 32 4 50 16" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 22 7 C 24 16, 24 24, 26 27" fill="none" stroke="#f0abfc" stroke-width="1.5"/>
    <path d="M 42 7 C 40 16, 40 24, 38 27" fill="none" stroke="#f0abfc" stroke-width="1.5"/>

    <!-- Balloon Burner Flame -->
    <polygon points="30,27 34,27 32,31" fill="#facc15"/>
    <polygon points="31,27 33,27 32,29" fill="#ef4444"/>

    <!-- Rigging Cables -->
    <line x1="20" y1="23" x2="24" y2="34" stroke="#64748b" stroke-width="1"/>
    <line x1="44" y1="23" x2="40" y2="34" stroke="#64748b" stroke-width="1"/>
    <line x1="28" y1="27" x2="28" y2="34" stroke="#64748b" stroke-width="1"/>
    <line x1="36" y1="27" x2="36" y2="34" stroke="#64748b" stroke-width="1"/>

    <!-- Bus Body (School Bus in Battle Blue) -->
    <rect x="16" y="34" width="32" height="15" rx="3" fill="#2563eb" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Yellow warning bumper and stripe -->
    <rect x="14" y="44" width="36" height="3" fill="#eab308" stroke="#0f172a" stroke-width="1"/>
    
    <!-- Windows -->
    <rect x="18" y="37" width="4" height="4" rx="0.5" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8"/>
    <rect x="24" y="37" width="5" height="4" rx="0.5" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8"/>
    <rect x="31" y="37" width="5" height="4" rx="0.5" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8"/>
    <rect x="38" y="37" width="5" height="4" rx="0.5" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8"/>

    <!-- Bus Wheels -->
    <circle cx="22" cy="50" r="3.5" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <circle cx="22" cy="50" r="1.5" fill="#94a3b8"/>
    <circle cx="42" cy="50" r="3.5" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <circle cx="42" cy="50" r="1.5" fill="#94a3b8"/>

    <!-- Front & Rear Lights -->
    <circle cx="47" cy="42" r="1" fill="#fef08a"/>
    <circle cx="17" cy="42" r="1" fill="#ef4444"/>
  </g>
</svg>
