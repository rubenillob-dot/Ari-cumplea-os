<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <!-- Drop shadow for high contrast on any background -->
    <filter id="pickaxe-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blade-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <g filter="url(#pickaxe-shadow)">
    <!-- Handle (Shaft) angled from (12, 12) down-right to (35, 35) -->
    <line x1="12" y1="12" x2="35" y2="35" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="12" x2="35" y2="35" stroke="url(#handle-grad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Grip Tape wraps -->
    <line x1="19" y1="17" x2="21" y2="21" stroke="#f1f5f9" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="24" y1="22" x2="26" y2="26" stroke="#f1f5f9" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="29" y1="27" x2="31" y2="31" stroke="#f1f5f9" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Pommel at base -->
    <circle cx="35" cy="35" r="2.5" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>

    <!-- Collar / Neck Bracket -->
    <rect x="9.5" y="9.5" width="5.5" height="5.5" rx="1.5" transform="rotate(45 12 12)" fill="#475569" stroke="#0f172a" stroke-width="1"/>

    <!-- Main Pickaxe Head (Curved double-ended pick) -->
    <!-- Point 1 (Top-Left tip hotspot at 2, 4) to Point 2 (Back spike at 21, 5) through center (12, 12) -->
    <path d="M 3 5 
             C 6 2, 12 4, 18 8 
             L 21 6 
             L 20 11 
             L 14 14 
             C 9 11, 5 7, 3 5 Z" 
          fill="url(#metal-grad)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Sharp Cyan Reinforced Edge / Energy Glow -->
    <path d="M 3 5 C 6 2, 11 3, 15 6" stroke="url(#blade-edge)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Tactical Bolt in center -->
    <circle cx="12" cy="12" r="1.5" fill="#facc15" stroke="#0f172a" stroke-width="0.8"/>

    <!-- Sharp Tip sparkle (hotspot indicator at 3, 5) -->
    <circle cx="3" cy="5" r="1" fill="#ffffff"/>
  </g>
</svg>
