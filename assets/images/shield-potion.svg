<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="slurp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <filter id="potion-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Cork Cap -->
  <path d="M26 12 L38 12 L36 6 L28 6 Z" fill="#b45309" stroke="#78350f" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bottle Neck Ring -->
  <rect x="24" y="12" width="16" height="5" rx="2" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" />
  <rect x="26" y="17" width="12" height="6" fill="#cbd5e1" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Glow Potion Body -->
  <ellipse cx="32" cy="38" rx="22" ry="19" fill="#0284c7" opacity="0.4" filter="url(#potion-glow)"/>
  
  <!-- Glass Jar Body -->
  <path d="M26 23 C16 26 12 33 12 42 C12 53 20 58 32 58 C44 58 52 53 52 42 C52 33 48 26 38 23 Z" 
        fill="#0f172a" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="3" />
        
  <!-- Liquid Fill -->
  <path d="M15 42 C15 36 21 32 32 32 C43 32 49 36 49 42 C49 51 42 55 32 55 C22 55 15 51 15 42 Z" 
        fill="url(#slurp-glow)" />

  <!-- Animated Bubbles -->
  <circle cx="26" cy="44" r="3" fill="#ffffff" opacity="0.75" />
  <circle cx="38" cy="40" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="33" cy="48" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="22" cy="38" r="1.5" fill="#ffffff" opacity="0.6" />
  
  <!-- Glass Shine / Reflection Highlight -->
  <path d="M20 28 C16 32 15 38 15 45" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M47 38 C47 43 45 47 43 50" stroke="#a5f3fc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <circle cx="28" cy="28" r="1" fill="#fff" opacity="0.8"/>
</svg>
